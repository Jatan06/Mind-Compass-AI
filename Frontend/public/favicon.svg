<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Compass Outer Ring Gradient -->
    <linearGradient id="ring-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Leaf Needle Primary Gradient -->
    <linearGradient id="leaf-grad-1" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Leaf Needle Accent Gradient -->
    <linearGradient id="leaf-grad-2" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="192" stroke="url(#ring-grad)" stroke-width="20" stroke-opacity="0.9" />

  <!-- Dashed Inner Ring -->
  <circle cx="256" cy="256" r="160" stroke="#818cf8" stroke-width="6" stroke-dasharray="16 12" stroke-opacity="0.4" />

  <!-- Directional Ticks (N, S, E, W) -->
  <line x1="256" y1="72" x2="256" y2="100" stroke="#a855f7" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="412" x2="256" y2="440" stroke="#6366f1" stroke-width="12" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="412" y1="256" x2="440" y2="256" stroke="#6366f1" stroke-width="12" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="72" y1="256" x2="100" y2="256" stroke="#6366f1" stroke-width="12" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- Organic Leaf Compass Needle -->
  <g filter="url(#glow)">
    <!-- Primary Needle Half -->
    <path d="M256 120 C340 190, 360 310, 256 392 C250 330, 230 210, 256 120 Z" fill="url(#leaf-grad-1)" />

    <!-- Accent Leaf Half -->
    <path d="M256 120 C180 190, 160 310, 256 392 C262 330, 282 210, 256 120 Z" fill="url(#leaf-grad-2)" opacity="0.85" />

    <!-- Center Pivot Core -->
    <circle cx="256" cy="256" r="28" fill="#ffffff" />
    <circle cx="256" cy="256" r="16" fill="#4f46e5" />
  </g>
</svg>