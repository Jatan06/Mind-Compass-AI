<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Website Theme Background Gradient (Deep Forest Emerald to Night Slate) -->
    <linearGradient id="mc-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E352F" />
      <stop offset="100%" stop-color="#121615" />
    </linearGradient>

    <!-- Warm Cream Gold Accent Gradient -->
    <linearGradient id="mc-gold" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5EBE1" />
      <stop offset="50%" stop-color="#EADEC9" />
      <stop offset="100%" stop-color="#D6C4A5" />
    </linearGradient>

    <!-- Sage Green Secondary Gradient -->
    <linearGradient id="mc-sage" x1="120" y1="392" x2="392" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8BBAE" />
      <stop offset="50%" stop-color="#94A89A" />
      <stop offset="100%" stop-color="#6F8576" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="mc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Deep Forest Theme Color -->
  <rect width="512" height="512" rx="128" fill="url(#mc-bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#mc-sage)" stroke-width="4" stroke-opacity="0.3" fill="none" />

  <!-- Subtle Outer Guidance Ring -->
  <circle cx="256" cy="256" r="184" stroke="url(#mc-sage)" stroke-width="8" stroke-dasharray="14 10" stroke-opacity="0.35" />

  <!-- Zen Mind Star / Guidance Spark (Distinct 4-Point Curved Star Emblem) -->
  <g filter="url(#mc-glow)">
    <!-- Top & Right Petal / Spark (Gold Accent) -->
    <path d="M256 96 C256 186, 326 256, 416 256 C326 256, 256 326, 256 416 C256 326, 186 256, 96 256 C186 256, 256 186, 256 96 Z" fill="url(#mc-gold)" />

    <!-- Overlaid Soft Sage Inner Leaf Petal for Depth -->
    <path d="M256 144 C256 210, 302 256, 368 256 C302 256, 256 302, 256 368 C256 302, 210 256, 144 256 C210 256, 256 210, 256 144 Z" fill="url(#mc-sage)" opacity="0.65" />

    <!-- Center Pivot Core (Warm Gold Dot for Clarity) -->
    <circle cx="256" cy="256" r="32" fill="#1E352F" />
    <circle cx="256" cy="256" r="20" fill="url(#mc-gold)" />
    <circle cx="256" cy="256" r="8" fill="#FAF7F0" />
  </g>
</svg>